name: Market32 Browser QA
on:
  push:
    branches: [feat/market32-complete-dashboard-20261112]
    paths:
      - web/market32/**
      - scripts/market32-e2e.mjs
      - .github/workflows/market32-browser-qa.yml
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - name: Start Market32 static web server
        run: |
          python3 -m http.server 8123 --directory web/market32 > /tmp/market32-web.log 2>&1 &
          for i in 1 2 3 4 5 6 7 8; do curl -fsS http://127.0.0.1:8123/ >/dev/null && break || sleep 1; done
      - name: Test desktop and mobile browser navigation
        run: node scripts/market32-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market32-desktop-mobile-screenshots
          path: market32-screenshots
          if-no-files-found: ignore

name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run check && npm test
        working-directory: server
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build web preview
        run: flutter build web --release --no-web-resources-cdn --base-href /roll-dice/ --dart-define=API_URL="${{ vars.API_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: street-circle-web
          path: build/web
          retention-days: 14
  native-android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: street-circle-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
  native-ios:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --debug --no-codesign
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: street-circle-web
          path: web-preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-preview
      - uses: actions/deploy-pages@v4
        id: deployment

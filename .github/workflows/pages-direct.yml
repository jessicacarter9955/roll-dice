# The broad verification pipeline also builds Android/iOS and may queue for a
# long time. Keep Pages deployment independently verified and releaseable.
name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-direct
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build site with bundled table assets
        run: flutter build web --release --no-web-resources-cdn --base-href /roll-dice/ --dart-define=API_URL="${{ vars.API_URL }}"
      - name: Set up Node for Market32 React
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Market32 shadcn-admin React frontend
        run: |
          cd web/market32-react
          npm install --no-audit --no-fund
          MARKET32_BASE=/roll-dice/market32/ npm run build
      - name: Publish React frontend alongside Roll Dice without changing game assets
        run: |
          test -s web/market32-react/dist/index.html
          mkdir -p build/web/market32
          cp -R web/market32-react/dist/. build/web/market32/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - uses: actions/deploy-pages@v4
        id: deployment
